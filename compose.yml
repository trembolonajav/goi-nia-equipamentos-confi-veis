services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: locago
      POSTGRES_USER: locago
      POSTGRES_PASSWORD: locago_dev
    ports:
      - "5433:5432"
    volumes:
      - locago_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locago -d locago"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/locago
      DB_USER: locago
      DB_PASSWORD: locago_dev
      LOCAGO_UPLOAD_DIR: /data/clientes
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - locago_uploads:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  locago_postgres:
  locago_uploads:

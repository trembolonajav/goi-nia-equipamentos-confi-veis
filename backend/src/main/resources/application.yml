spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: locago-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/locago}
    username: ${DB_USER:locago}
    password: ${DB_PASSWORD:locago_dev}
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
